<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Derrick's Label Studio 2.8.1</title>

  <!-- Prevent HTTP disk caching of index page -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1b4b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Label Studio 2.8.1">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">

  <style>
    @page {
      size: 2.84in 1.95in;
      margin: 0;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 16px 12px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 45%, #020617 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .no-print {
      width: 100%;
      max-width: 540px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .title-group h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title-group p {
      margin: 2px 0 0 0;
      font-size: 11px;
      color: #94a3b8;
    }
    
    .badge-live {
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      transition: all 0.25s ease;
    }
    .badge-l {
      color: #f87171 !important;
      background: rgba(239, 68, 68, 0.15) !important;
      border: 1px solid rgba(248, 113, 113, 0.35) !important;
    }
    .badge-m {
      color: #fb923c !important;
      background: rgba(249, 115, 22, 0.15) !important;
      border: 1px solid rgba(251, 146, 60, 0.35) !important;
    }
    .badge-q {
      color: #facc15 !important;
      background: rgba(234, 179, 8, 0.15) !important;
      border: 1px solid rgba(250, 204, 21, 0.35) !important;
    }
    .badge-h {
      color: #34d399 !important;
      background: rgba(16, 185, 129, 0.15) !important;
      border: 1px solid rgba(52, 211, 153, 0.35) !important;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .col-span-2 {
      grid-column: span 2;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .field label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .field input, .field select {
      width: 100%;
      height: 44px;
      padding: 8px 12px;
      font-size: 16px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      background: rgba(2, 6, 23, 0.7);
      color: #f8fafc;
      outline: none;
    }
    .field input:focus, .field select:focus {
      border-color: #6366f1;
      background: rgba(15, 23, 42, 0.95);
    }
    select option {
      background: #0f172a;
      color: #ffffff;
    }

    .icon-field-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .icon-field-row select {
      flex: 1;
    }
    .circle-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      height: 44px;
      padding: 0 10px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .circle-toggle input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #6366f1;
      cursor: pointer;
      margin: 0;
    }
    .circle-toggle span {
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .custom-row {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(2, 6, 23, 0.4);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    button {
      flex: 1;
      height: 46px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4);
    }

    #labels-container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .label-page {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 6px;
      border-radius: 12px;
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.7);
    }
    .label-page svg {
      width: 100% !important;
      height: auto !important;
      display: block !important;
      background: #ffffff;
    }

    @media (max-width: 480px) {
      body { padding: 10px 8px; }
      .no-print { padding: 14px; }
      .custom-row { grid-template-columns: 1fr; }
    }

    @media print {
      body { background: #ffffff !important; padding: 0 !important; margin: 0 !important; }
      .no-print { display: none !important; }
      #labels-container { display: block !important; max-width: none !important; padding: 0 !important; margin: 0 !important; }
      .label-page {
        width: 2.84in !important;
        height: 1.95in !important;
        max-width: none !important;
        padding: 0 !important;
        margin: 0 !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        page-break-after: always !important;
        break-after: page !important;
      }
      .label-page svg {
        width: 2.84in !important;
        height: 1.95in !important;
      }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <div class="panel-header">
      <div class="title-group">
        <h1>Derrick's Label Studio 2.8.1</h1>
        <p>2.84" &times; 1.95" Direct Thermal Fulfillment Labels</p>
      </div>
      <span id="eccBadge" class="badge-live badge-h">ECC: Level H (30%)</span>
    </div>

    <div class="controls-grid">
      <div class="field col-span-2">
        <label for="labelType">Label Preset</label>
        <select id="labelType" onchange="window.handleTypeChange()">
          <option value="curbside" selected>Curbside</option>
          <option value="pickup">Pickup</option>
          <option value="ambient_f">Ambient F</option>
          <option value="ambient_b">Ambient B</option>
          <option value="ambient_ex">AmbientEx</option>
          <option value="chilled_ex">ChilledEx</option>
          <option value="freezer_ex">FreezerEx</option>
          <option value="delivery_f">Delivery F</option>
          <option value="delivery_b">Delivery B</option>
          <option value="office_security">Office Security</option>
          <option value="text_only">Text Only</option>
          <option value="custom">Custom</option>
        </select>
      </div>

      <!-- Text Only Mode Controls -->
      <div id="textOnlyRow" class="custom-row col-span-2">
        <div class="field col-span-2">
          <label for="textOnlyContent">Center Text</label>
          <input type="text" id="textOnlyContent" value="HOLD" oninput="window.buildLabels()">
        </div>
        <div class="field col-span-2">
          <label for="topIcon">Top Icon (Middle)</label>
          <div class="icon-field-row">
            <select id="topIcon" onchange="window.buildLabels()">
              <option value="none" selected>(None)</option>
              <option value="bag_spark">T-Bag (Spark)</option>
              <option value="tbag_question">T-Bag (?)</option>
              <option value="chilled">Chilled (Thermometer)</option>
              <option value="frozen">Frozen (Snowflake)</option>
              <option value="car">Car</option>
              <option value="letter_f">Letter F</option>
              <option value="letter_b">Letter B</option>
              <option value="key">Key</option>
              <option value="truck">Delivery Truck</option>
              <option value="pig">Pig</option>
              <option value="cow">Cow</option>
              <option value="chicken">Chicken</option>
              <option value="cheese">Cheese</option>
              <option value="deli_slicer">Deli Slicer</option>
              <option value="claims_tag">Claims Tag</option>
            </select>
            <label class="circle-toggle" title="Toggle black background circle">
              <input type="checkbox" id="topCircleCheck" onchange="window.buildLabels()">
              <span>Circle?</span>
            </label>
          </div>
        </div>
        <div class="field col-span-2">
          <label for="bottomIcon">Bottom Icon (Middle)</label>
          <div class="icon-field-row">
            <select id="bottomIcon" onchange="window.buildLabels()">
              <option value="none" selected>(None)</option>
              <option value="bag_spark">T-Bag (Spark)</option>
              <option value="tbag_question">T-Bag (?)</option>
              <option value="chilled">Chilled (Thermometer)</option>
              <option value="frozen">Frozen (Snowflake)</option>
              <option value="car">Car</option>
              <option value="letter_f">Letter F</option>
              <option value="letter_b">Letter B</option>
              <option value="key">Key</option>
              <option value="truck">Delivery Truck</option>
              <option value="pig">Pig</option>
              <option value="cow">Cow</option>
              <option value="chicken">Chicken</option>
              <option value="cheese">Cheese</option>
              <option value="deli_slicer">Deli Slicer</option>
              <option value="claims_tag">Claims Tag</option>
            </select>
            <label class="circle-toggle" title="Toggle black background circle">
              <input type="checkbox" id="bottomCircleCheck" onchange="window.buildLabels()">
              <span>Circle?</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Custom Mode Controls -->
      <div id="customRow" class="custom-row col-span-2">
        <div id="customTitleField" class="field col-span-2">
          <label for="customTitle">Custom Header</label>
          <input type="text" id="customTitle" value="SPECIAL" oninput="window.buildLabels()">
        </div>

        <div id="badgeIconField" class="field col-span-2">
          <label for="customIcon">Badge Icon</label>
          <div class="icon-field-row">
            <select id="customIcon" onchange="window.buildLabels()">
              <option value="none">(None)</option>
              <option value="bag_spark" selected>T-Bag (Spark)</option>
              <option value="tbag_question">T-Bag (?)</option>
              <option value="chilled">Chilled (Thermometer)</option>
              <option value="frozen">Frozen (Snowflake)</option>
              <option value="car">Car</option>
              <option value="letter_f">Letter F</option>
              <option value="letter_b">Letter B</option>
              <option value="key">Key</option>
              <option value="truck">Delivery Truck</option>
              <option value="pig">Pig</option>
              <option value="cow">Cow</option>
              <option value="chicken">Chicken</option>
              <option value="cheese">Cheese</option>
              <option value="deli_slicer">Deli Slicer</option>
              <option value="claims_tag">Claims Tag</option>
            </select>
            <label class="circle-toggle" title="Toggle black background circle">
              <input type="checkbox" id="badgeCircleCheck" checked onchange="window.buildLabels()">
              <span>Circle?</span>
            </label>
          </div>
        </div>

        <div id="rawIconField" class="field col-span-2" style="display: none;">
          <label for="customRawIcon">Left Icon</label>
          <div class="icon-field-row">
            <select id="customRawIcon" onchange="window.buildLabels()">
              <option value="none" selected>(None)</option>
              <option value="bag_spark">T-Bag (Spark)</option>
              <option value="tbag_question">T-Bag (?)</option>
              <option value="chilled">Chilled (Thermometer)</option>
              <option value="frozen">Frozen (Snowflake)</option>
              <option value="car">Car</option>
              <option value="letter_f">Letter F</option>
              <option value="letter_b">Letter B</option>
              <option value="key">Key</option>
              <option value="truck">Delivery Truck</option>
              <option value="pig">Pig</option>
              <option value="cow">Cow</option>
              <option value="chicken">Chicken</option>
              <option value="cheese">Cheese</option>
              <option value="deli_slicer">Deli Slicer</option>
              <option value="claims_tag">Claims Tag</option>
            </select>
            <label class="circle-toggle" title="Toggle black background circle">
              <input type="checkbox" id="rawCircleCheck" onchange="window.buildLabels()">
              <span>Circle?</span>
            </label>
          </div>
        </div>
      </div>

      <div id="startNumField" class="field">
        <label for="startNum">Start #</label>
        <input type="number" id="startNum" value="1" min="0" oninput="window.handleStartChange()">
      </div>

      <div class="field">
        <label for="labelCount">Quantity</label>
        <input type="number" id="labelCount" value="1" min="1" max="100" oninput="window.buildLabels()">
      </div>

      <div id="eccField" class="field col-span-2">
        <label for="eccLevel">Error Correction Level</label>
        <select id="eccLevel" onchange="window.buildLabels()">
          <option value="L">Level L (~7% recovery - Smallest modules)</option>
          <option value="M">Level M (~15% recovery - Standard logistics)</option>
          <option value="Q">Level Q (~25% recovery - Moderate smudge protection)</option>
          <option value="H" selected>Level H (~30% recovery - Maximum durability)</option>
        </select>
      </div>
    </div>

    <div class="btn-row">
      <button type="button" class="btn-secondary" onclick="window.buildLabels()">&#x21bb; Generate</button>
      <button type="button" class="btn-primary" onclick="window.print()">&#x2399; Print Labels</button>
    </div>
  </div>

  <div id="labels-container"></div>

    window.updateCustomFieldsVisibility = function() {
      var sel = document.getElementById('labelType');
      var customRow = document.getElementById('customRow');
      var textOnlyRow = document.getElementById('textOnlyRow');
      var startInp = document.getElementById('startNum');
      var startNumField = document.getElementById('startNumField');
      var eccField = document.getElementById('eccField');
      var eccBadge = document.getElementById('eccBadge');
      var titleField = document.getElementById('customTitleField');
      var badgeField = document.getElementById('badgeIconField');
      var rawField = document.getElementById('rawIconField');
      if (!sel) return;

      var mode = sel.value;
      var isCustom = (mode === 'custom');
      var isTextOnly = (mode === 'text_only');

      if (customRow) customRow.style.display = isCustom ? 'grid' : 'none';
      if (textOnlyRow) textOnlyRow.style.display = isTextOnly ? 'grid' : 'none';

      if (startNumField) startNumField.style.display = isTextOnly ? 'none' : 'flex';
      if (eccField) eccField.style.display = isTextOnly ? 'none' : 'flex';
      if (eccBadge) eccBadge.style.display = isTextOnly ? 'none' : 'inline-block';

      var start = parseInt(startInp ? startInp.value : '1', 10);
      if (isNaN(start) || start < 0) start = 0;

      if (isCustom && start === 0) {
        if (titleField) titleField.className = 'field col-span-2';
        if (badgeField) badgeField.className = 'field col-span-2';
        if (rawField) {
          rawField.style.display = 'flex';
          rawField.className = 'field col-span-2';
        }
      } else {
        if (titleField) titleField.className = 'field col-span-2';
        if (badgeField) badgeField.className = 'field col-span-2';
        if (rawField) {
          rawField.style.display = 'none';
        }
      }
    };

    window.handleTypeChange = function() {
      window.updateCustomFieldsVisibility();
      window.buildLabels();
    };

    window.handleStartChange = function() {
      window.updateCustomFieldsVisibility();
      window.buildLabels();
    };

    function renderIcon(key, hasCircle) {
      if (!key || key === 'none') return '';
      return hasCircle ? (ICONS[key] || '') : (RAW_ICONS[key] || '');
    }

    window.buildLabels = function() {
      try {
        var sel = document.getElementById('labelType');
        var startInp = document.getElementById('startNum');
        var countInp = document.getElementById('labelCount');
        var eccInp = document.getElementById('eccLevel');
        var container = document.getElementById('labels-container');
        var badge = document.getElementById('eccBadge');
        if (!sel || !startInp || !countInp || !container) return;

        var mode = sel.value;
        var rawStart = startInp.value != null ? String(startInp.value).trim() : '1';
        var start = parseInt(rawStart, 10);
        if (isNaN(start) || start < 0) start = 0;

        var count = parseInt(countInp.value, 10) || 1;
        var ecc = eccInp ? eccInp.value : 'H';
        if (count < 1) count = 1;
        if (count > 100) count = 100;

        if (badge) {
          var eccMap = {
            'L': { pct: '7%', cls: 'badge-l' },
            'M': { pct: '15%', cls: 'badge-m' },
            'Q': { pct: '25%', cls: 'badge-q' },
            'H': { pct: '30%', cls: 'badge-h' }
          };
          var targetTheme = eccMap[ecc] || eccMap['H'];
          badge.textContent = 'ECC: Level ' + ecc + ' (' + targetTheme.pct + ')';
          badge.className = 'badge-live ' + targetTheme.cls;
        }

        container.innerHTML = '';
        var htmlBuffer = '';

        if (mode === 'text_only') {
          var textOnlyInp = document.getElementById('textOnlyContent');
          var textContent = (textOnlyInp && textOnlyInp.value) ? textOnlyInp.value.trim() : 'HOLD';

          var topIconSelect = document.getElementById('topIcon');
          var bottomIconSelect = document.getElementById('bottomIcon');
          var topCircleCheck = document.getElementById('topCircleCheck');
          var bottomCircleCheck = document.getElementById('bottomCircleCheck');

          var topIconKey = topIconSelect ? topIconSelect.value : 'none';
          var bottomIconKey = bottomIconSelect ? bottomIconSelect.value : 'none';
          var topHasCircle = topCircleCheck ? topCircleCheck.checked : false;
          var bottomHasCircle = bottomCircleCheck ? bottomCircleCheck.checked : false;

          var topSvg = renderIcon(topIconKey, topHasCircle);
          var bottomSvg = renderIcon(bottomIconKey, bottomHasCircle);

          var centerFontSize = 145;
          if (textContent.length > 8) centerFontSize = 95;
          else if (textContent.length > 5) centerFontSize = 120;

          var topElement = topSvg ? '<g transform="translate(426, 95)">' + topSvg + '</g>' : '';
          var bottomElement = bottomSvg ? '<g transform="translate(426, 490)">' + bottomSvg + '</g>' : '';

          for (var i = 0; i < count; i++) {
            htmlBuffer += '<div class="label-page">' +
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 585">' +
              '<rect width="852" height="585" fill="#ffffff"/>' +
              topElement +
              '<text x="426" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="' + centerFontSize + '" font-weight="800" letter-spacing="1" text-anchor="middle" dominant-baseline="central" fill="#000000">' + textContent + '</text>' +
              bottomElement +
              '</svg></div>';
          }

          container.innerHTML = htmlBuffer;
          return;
        }

        var title = "Curbside";
        var fontSize = 128;
        var iconKey = "bag_spark";
        var rawIconKey = "none";
        var qrPrefix = "Curbside";
        var qrSuffix = "";
        var isCustom = (mode === 'custom');

        var badgeCircle = true;
        var leftCircle = false;

        if (mode === 'curbside') {
          title = "Curbside";
          fontSize = 128;
          iconKey = "bag_spark";
          qrPrefix = "Curbside";
        } else if (mode === 'pickup') {
          title = "Pickup";
          fontSize = 128;
          iconKey = "car";
          qrPrefix = "Pickup";
        } else if (mode === 'ambient_f') {
          title = "Ambient";
          fontSize = 128;
          iconKey = "letter_f";
          qrPrefix = "Ambient";
          qrSuffix = " F";
        } else if (mode === 'ambient_b') {
          title = "Ambient";
          fontSize = 128;
          iconKey = "letter_b";
          qrPrefix = "Ambient";
          qrSuffix = " B";
        } else if (mode === 'ambient_ex') {
          title = "AmbientEx";
          fontSize = 128;
          iconKey = "tbag_question";
          qrPrefix = "AmbientEx";
        } else if (mode === 'chilled_ex') {
          title = "ChilledEx";
          fontSize = 128;
          iconKey = "chilled";
          qrPrefix = "ChilledEx";
        } else if (mode === 'freezer_ex') {
          title = "FreezerEx";
          fontSize = 128;
          iconKey = "frozen";
          qrPrefix = "FreezerEx";
        } else if (mode === 'delivery_f') {
          title = "Delivery";
          fontSize = 128;
          iconKey = "letter_f";
          qrPrefix = "Delivery";
          qrSuffix = " F";
        } else if (mode === 'delivery_b') {
          title = "Delivery";
          fontSize = 128;
          iconKey = "letter_b";
          qrPrefix = "Delivery";
          qrSuffix = " B";
        } else if (mode === 'office_security') {
          title = "Office Security";
          fontSize = 115;
          iconKey = "key";
          qrPrefix = "Office Security";
        } else if (isCustom) {
          var customTitleInp = document.getElementById('customTitle');
          var customIconInp = document.getElementById('customIcon');
          var customRawIconInp = document.getElementById('customRawIcon');
          var badgeCheck = document.getElementById('badgeCircleCheck');
          var rawCheck = document.getElementById('rawCircleCheck');

          var userText = (customTitleInp && customTitleInp.value) ? customTitleInp.value.trim() : 'SPECIAL';
          iconKey = customIconInp ? customIconInp.value : 'bag_spark';
          rawIconKey = (start === 0 && customRawIconInp) ? customRawIconInp.value : 'none';

          badgeCircle = badgeCheck ? badgeCheck.checked : true;
          leftCircle = rawCheck ? rawCheck.checked : false;

          title = userText;
          qrPrefix = userText;
          fontSize = 128;
        }

        var rightSvg = renderIcon(iconKey, badgeCircle);
        var leftSvg = renderIcon(rawIconKey, leftCircle);

        for (var i = 0; i < count; i++) {
          var num = start + i;
          var hasNumber = !(isCustom && start === 0);

          var qrDataText = hasNumber ? (qrPrefix + " " + num + qrSuffix) : qrPrefix;
          var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&ecc=" + ecc + "&data=" + encodeURIComponent(qrDataText);
          var numFontSize = String(num).length > 2 ? 105 : 130;

          var leftContent = '';
          if (hasNumber) {
            leftContent = '<text x="145" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="' + numFontSize + '" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#000000">' + num + '</text>';
          } else if (leftSvg) {
            leftContent = '<g transform="translate(145, 380)">' + leftSvg + '</g>';
          }

          var rightContent = '';
          if (rightSvg) {
            rightContent = '<g transform="translate(707, 380)">' + rightSvg + '</g>';
          }

          htmlBuffer += '<div class="label-page">' +
            '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 852 585">' +
            '<rect width="852" height="585" fill="#ffffff"/>' +
            '<text x="426" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="' + fontSize + '" font-weight="700" letter-spacing="0.5" text-anchor="middle" fill="#000000">' + title + '</text>' +
            leftContent +
            '<image href="' + qrUrl + '" xlink:href="' + qrUrl + '" x="276" y="230" width="300" height="300"/>' +
            rightContent +
            '</svg></div>';
        }

        container.innerHTML = htmlBuffer;
      } catch (err) {
        console.error("Error building labels:", err);
      }
    };

    window.addEventListener('DOMContentLoaded', function() {
      window.updateCustomFieldsVisibility();
      window.buildLabels();
    });

    // PWA Service Worker Auto-Updater
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
          .then(function(reg) {
            reg.update();
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', function() {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  window.location.reload();
                }
              });
            });
          })
          .catch(function(err) {
            console.warn('SW registration failed:', err);
          });

        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>
</body>
</html>
